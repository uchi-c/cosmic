name: Deploy Supabase Functions

# Auto-deploys the Stripe edge functions whenever they change on main
# (or run manually via the Actions tab).
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   — supabase.com/dashboard/account/tokens
# Optional secrets (if set, they are synced to the project on each deploy):
#   STRIPE_SECRET_KEY       — sk_test_… / sk_live_…
#   STRIPE_WEBHOOK_SECRET   — whsec_…
# Optional repo variable (Settings → Variables): SUPABASE_PROJECT_REF
#   defaults to the project below if unset.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'ubpfikqzhznlvhckfdng' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Guard — require access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi

      - name: Sync Stripe secrets (optional)
        if: ${{ env.STRIPE_SECRET_KEY != '' }}
        run: |
          supabase secrets set "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" --project-ref "$PROJECT_REF"
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            supabase secrets set "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET" --project-ref "$PROJECT_REF"
          fi

      - name: Deploy functions
        run: |
          supabase functions deploy create-payment-intent   --project-ref "$PROJECT_REF"
          supabase functions deploy create-checkout-session  --project-ref "$PROJECT_REF"
          supabase functions deploy stripe-webhook           --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Summary
        run: |
          echo "### Supabase functions deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- create-payment-intent" >> "$GITHUB_STEP_SUMMARY"
          echo "- create-checkout-session" >> "$GITHUB_STEP_SUMMARY"
          echo "- stripe-webhook" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Webhook URL: https://$PROJECT_REF.functions.supabase.co/stripe-webhook" >> "$GITHUB_STEP_SUMMARY"
